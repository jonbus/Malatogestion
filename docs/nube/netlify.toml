[build]
  publish = "public"
  functions = "netlify/functions"

# Las llamadas a /api/... las atiende la función
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# El código NO se guarda en caché: así, al publicar una versión nueva, el móvil
# coge la buena al momento y no se mezclan archivos de dos versiones.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
