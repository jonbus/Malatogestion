<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f6f43">
<title>Malato · en construcción</title>
<style>
  :root {
    --verde: #1f6f43;
    --tinta: #1d2b24;
    --papel: #f6f3ea;
    --borde: #ddd6c6;
    --suave: #66736b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 15% 10%, rgba(31,111,67,.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(31,111,67,.06), transparent 40%),
      var(--papel);
    color: var(--tinta);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 440px;
    text-align: center;
    background: #fff;
    border: 1px solid var(--borde);
    border-radius: 24px;
    padding: 42px 28px 34px;
    box-shadow: 0 18px 50px rgba(29, 43, 36, .09);
  }
  .logo {
    width: 104px;
    height: auto;
    display: block;
    margin: 0 auto 14px;
  }
  .marca {
    display: inline-block;
    color: var(--verde);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .38em;
    text-transform: uppercase;
    margin: 0 0 18px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(26px, 6vw, 34px);
    line-height: 1.15;
    letter-spacing: -.02em;
  }
  .texto {
    margin: 0 auto;
    max-width: 32ch;
    color: var(--suave);
    font-size: 16px;
  }
  .linea {
    width: 52px;
    height: 3px;
    margin: 26px auto 22px;
    border-radius: 99px;
    background: var(--verde);
    opacity: .85;
  }
  .pie {
    margin: 0 auto;
    max-width: 34ch;
    color: #7b857f;
    font-size: 13px;
    line-height: 1.55;
  }
  @media (max-width: 420px) {
    main { padding: 34px 20px 28px; border-radius: 20px; }
    .logo { width: 88px; }
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="/logo-o-verde.png" alt="Malato" width="154" height="170">
    <div class="marca">Malato</div>
    <h1>Web en construcción</h1>
    <p class="texto">Estamos preparando la nueva web de Malato. Muy pronto estará aquí.</p>
    <div class="linea" aria-hidden="true"></div>
    <p class="pie">Gracias por tu paciencia. Si necesitas hacer un pedido, usa el enlace directo que te ha dado la tienda.</p>
  </main>
</body>
</html>
